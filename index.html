<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Havi összesítő</title>

  <!-- PWA -->
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!-- ===== FEJLÉC ===== -->
  <header class="header">
    <div class="title">
      Havi összesítő
      <span class="badge online" id="netBadge">● online</span>
    </div>

    <div class="actions">
      <button id="btnExport" class="btn">CSV export</button>
      <button id="btnCopyId" class="btn btn-secondary" title="Eszköz azonosító">
        ID
      </button>
    </div>
  </header>

  <!-- ===== TARTALOM ===== -->
  <main class="container">

    <!-- ÚJ TÉTEL -->
    <section class="card">
      <div class="row">
        <div class="col">
          <label class="label" for="valueInput">Új tétel</label>
          <input
            id="valueInput"
            class="input"
            inputmode="decimal"
            placeholder="pl. 12,5"
          />
        </div>

        <button id="btnAdd" class="btn btn-primary">
          Hozzáad
        </button>
      </div>
    </section>

    <!-- ÖSSZEGZÉS -->
    <section class="card">
      <div class="row row-wrap">

        <div class="col">
          <label class="label" for="monthSelect">Hónap</label>
          <select id="monthSelect" class="select"></select>
        </div>

        <div class="col sum">
          <div class="label">Összeg</div>
          <div id="sumValue" class="sumValue">0</div>
        </div>

        <div class="col sum">
          <div class="label">Forint</div>
          <div id="forintValue" class="sumValue">0</div>
        </div>

        <div class="col right">
          <button id="btnMultiplier" class="btn btn-secondary">
            Szorzó: <span id="multiplierValue">1</span>
          </button>
        </div>

      </div>
    </section>

    <!-- LISTA -->
    <section class="card">

      <div class="tableHeader">
        <div>Időpont</div>
        <div class="right">Érték</div>
      </div>

      <div id="list" class="list">
        <!-- app.js tölti -->
      </div>

    </section>

  </main>

  <!-- ===== SCRIPTEK ===== -->
  <script type="module" src="./config.js"></script>
  <script type="module" src="./app.js"></script>

</body>
</html>
